/* ---------- shared textures ---------- */
function makeSandTex(){

  g1.putImageData(d1,0,0);g2.putImageData(d2,0,0);

function makeRockTex(r,gc,b){

}

    gr.addColorStop(0.45,`rgb(${b[0]|0},${b[1]|0},${b[2]|0})`);

function makeCloudTex(){

    [1,-1].forEach(s=>{if(rnd()<0.04)return;const a=0.62+(rnd()-0.5)*0.2,ex=x+Math.cos(a)*len,ey=64+s*Math.sin(a)*len;

const [sandMap,sandBump]=makeSandTex();
const limeTex=makeRockTex(232,210,170),rockTex=makeRockTex(196,160,112),brickTex=makeBrickTex(),cloudTex=makeCloudTex(),flameTex=makeFlameTex();

/* ---------- sky & light ---------- */
const skyGeo=new THREE.SphereGeometry(220,40,24),skyCol=[],tc=new THREE.Color();
const cH=new THREE.Color(0xf4a35c),cM=new THREE.Color(0xd8655c),cU=new THREE.Color(0x8a4a6e),cT=new THREE.Color(0x2f2550);
{const sp=skyGeo.attributes.position;for(let i=0;i<sp.count;i++){const t=sp.getY(i)/220;
  if(t<0.03)tc.copy(cH);else if(t<0.17)tc.copy(cH).lerp(cM,(t-0.03)/0.14);else if(t<0.42)tc.copy(cM).lerp(cU,(t-0.17)/0.25);else tc.copy(cU).lerp(cT,Math.min(1,(t-0.42)/0.45));

Object.assign(sun.shadow.camera,{left:-6.8,right:6.8,top:6.8,bottom:-6.8,near:1,far:60});

  const a=THREE.MathUtils.degToRad(params.alt),z=THREE.MathUtils.degToRad(params.az);

  const n=params.dust;for(let i=0;i<n;i++){let x=dpos[i*3]+params.wind*dt*(0.35+0.25*Math.sin(dph[i]));if(x>5.5)x=-5.5;dpos[i*3]=x;dpos[i*3+1]+=Math.sin(t*0.8+dph[i])*0.0015;}
  dGeo.attributes.position.needsUpdate=true;
  if(params.pondDrops&&t>nextDrop){const a=Math.random()*6.28,r=Math.sqrt(Math.random())*0.75;rippleAt({x:3.7+Math.cos(a)*r,z:1.5+Math.sin(a)*r*0.7},0.5);nextDrop=t+1.2+Math.random()*2.5;}
  while(ripples.length&&t-ripples[0].t0>4)ripples.shift();
  {const pp=pondGeo.attributes.position;for(let i=0;i<pN;i++)pp.setZ(i,pondH(pBase[i*2],pBase[i*2+1],t));pp.needsUpdate=true;pondGeo.computeVertexNormals();}
  pads.forEach((p,i)=>{p.m.position.set(3.7+p.x,0.024+pondH(p.x,p.y,t),1.5-p.y*0.7);p.m.rotation.y=p.rot+Math.sin(t*0.3+i)*0.2;});
  people.forEach((p,k)=>poseStand(p,t,k));sitters.forEach((p,k)=>poseSit(p,t,k));
  extraAnim.forEach(f=>f(t,dt));
  controls.update();renderer.render(scene,camera);requestAnimationFrame(tick);
}
tick();
})();
</script>
